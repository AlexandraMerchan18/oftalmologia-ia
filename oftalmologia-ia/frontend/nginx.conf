# Sirve el frontend compilado y redirige /api al backend (mismo origen: sin problemas de CORS).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 30m;          # audios de dictado

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;       # Whisper en CPU + agente pueden tardar
        proxy_send_timeout 180s;
    }

    location / {
        try_files $uri /index.html;
    }
}
